<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006b40" />
      <stop offset="50%" stop-color="#008751" />
      <stop offset="100%" stop-color="#004d2e" />
    </linearGradient>
    <pattern id="flagPattern" width="600" height="300" patternUnits="userSpaceOnUse">
      <rect width="200" height="300" fill="#008751"/>
      <rect x="200" width="200" height="300" fill="#ffffff"/>
      <rect x="400" width="200" height="300" fill="#008751"/>
    </pattern>
  </defs>
  <!-- Background with Nigerian Flag 3 bands -->
  <rect width="400" height="630" fill="#008751" />
  <rect x="400" width="400" height="630" fill="#ffffff" />
  <rect x="800" width="400" height="630" fill="#008751" />

  <!-- Center emblem and text -->
  <circle cx="600" cy="315" r="160" fill="#008751" fill-opacity="0.08" stroke="#008751" stroke-width="6" stroke-dasharray="16 12"/>
  <text x="600" y="305" font-family="'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#008751" text-anchor="middle" letter-spacing="-1">FEDERAL REPUBLIC</text>
  <text x="600" y="355" font-family="'Cabinet Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="4">OF NIGERIA</text>
  <text x="600" y="395" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#008751" text-anchor="middle">PEACE AND PROGRESS 🇳🇬</text>
</svg>
